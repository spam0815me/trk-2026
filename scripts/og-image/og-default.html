<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<!--
  Render-Vorlage für das Social-Sharing-Bild (Open Graph / Twitter Card).
  Ausgabe: public/images/og-default.jpg  (1200 × 630)

  Neu rendern: scripts/og-image/og-default.html bei Viewport 1200×630 öffnen
  und .og-card als Bild exportieren (oder via Playwright-Screenshot des Viewports),
  danach mit sips auf JPG bringen. Siehe scripts/og-image/README.md.

  Aktuelles Motiv: das Negativ-Logo – weisse Kuh im gelben X, enthält bereits
  «Tierrechtskongress 2026 / Tier im Fokus» – gross und zentriert auf dunklem
  Grund, gleicher Look wie der Website-Footer und die Sharepics.

  Wichtig: Verwendet wird trk-logo-trim.png (zugeschnittenes Logo), weil das volle PNG
  ungleiche transparente Ränder hat und das Motiv sonst nicht echt mittig sässe.
  Verbindliche Logo-Quellen sind public/images/trk-logo.svg und
  public/images/TRK_26_Logo_negativ.svg (Kuh IM X) – daraus entstehen die PNGs und daraus
  die Trims. Eine Kuh ohne X ist kein offizielles Logo, siehe README.
-->
<style>
  :root {
    --brand-black: #26282a;
    --brand-gold:  #e5b969;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: #cfcfca; }

  .og-card {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    /* Dunkler Grund wie im Website-Footer und in den Sharepics */
    background: var(--brand-black);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Getrimmtes Logo gross & echt zentriert (Motiv = Bounding-Box).
     Höhe limitiert das 1200×630-Format; 600px lässt ~15px Safe-Margin oben/unten. */
  .og-card__logo {
    height: 600px;
    width: auto;
    display: block;
  }
</style>
</head>
<body>
  <div class="og-card">
    <img class="og-card__logo"
         src="trk-logo-negativ-trim.png"
         alt="Tierrechtskongress 2026 – Tier im Fokus" />
  </div>
</body>
</html>
