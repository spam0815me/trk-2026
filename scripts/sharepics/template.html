<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<!--
  Render-Vorlage für die Social-Media-Grafiken auf /medien.
  Wird von build.py befüllt und per Chrome-Headless als PNG geschossen.
  Direkt im Browser öffnen geht auch — dann stehen die Platzhalter drin.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --brand-black: #26282a;
    --brand-gold:  #e5b969;
    --brand-white: #fafaff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #cfcfca; }

  .card {
    width: __WIDTH__px;
    height: __HEIGHT__px;
    position: relative;
    overflow: hidden;
    background-image: url('../../public/images/trk-header-bg.webp');
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: __SUBGAP__px;
    padding: __PADTOP__px __PAD__px 0;
    font-family: 'Poppins', system-ui, sans-serif;
  }

  /* So gross wie die Breite erlaubt, aber nie höher als __LOGOMAX__px —
     sonst schöbe das Logo den gelben Balken aus dem Bild. */
  .card__logo {
    width: __LOGOW__px;
    height: auto;
    max-height: __LOGOMAX__px;
    object-fit: contain;
    display: block;
    margin-top: __LOGOTOP__px;
  }

  .card__headline {
    font-weight: 800;
    font-size: __HEADSIZE__px;
    line-height: 1.05;
    color: var(--brand-black);
    text-align: center;
    letter-spacing: -0.01em;
    max-width: 100%;
  }

  .card__text {
    width: 100%;
    margin: auto 0;          /* verteilt den Restraum ober- und unterhalb des Textes */
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card__sub {
    font-weight: 600;
    font-size: __SUBSIZE__px;
    line-height: 1.3;
    color: var(--brand-black);
    text-align: center;
    margin-top: __SUBGAP__px;
  }

  /* Gelber Fussbalken mit Datum, Ort und Adresse der Website */
  .card__bar {
    width: calc(100% + __PAD2__px);
    margin: 0 -__PAD__px;
    background: var(--brand-gold);
    color: var(--brand-black);
    padding: __BARPAD__px __PAD__px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: __BARGAP__px;
  }

  .card__date {
    font-weight: 800;
    font-size: __DATESIZE__px;
    letter-spacing: 0.01em;
    text-align: center;
  }

  .card__place {
    font-weight: 600;
    font-size: __PLACESIZE__px;
    text-align: center;
  }

  .card__url {
    font-weight: 800;
    font-size: __URLSIZE__px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="card__logo" src="../og-image/trk-logo-trim.png"
         alt="Tierrechtskongress 2026 — Tier im Fokus (TIF)" />

    <div class="card__text">
      <p class="card__headline">__HEADLINE__</p>
      <p class="card__sub">__SUB__</p>
    </div>

    <div class="card__bar">
      <p class="card__date">23. bis 25. Oktober 2026</p>
      <p class="card__place">Photobastei Zürich</p>
      <p class="card__url">tierrechtskongress.ch</p>
    </div>
  </div>
</body>
</html>
